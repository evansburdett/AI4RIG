services:
  db:
    image: postgres:16
    container_name: ai4rig-db
    environment:
      POSTGRES_USER: ai4rig
      POSTGRES_PASSWORD: devonly
      POSTGRES_DB: ai4rig
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai4rig"]
      interval: 5s
      retries: 5

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
