# Builds the desktop installers on real Windows and macOS machines, then
# starts each packaged app and checks that it works (scripts/smoke-test.mjs).
# See docs/DESKTOP.md.
#
#   Pull request touching the desktop app   build + smoke test; installers
#                                           are attached to the run to try
#   "Run workflow" on the Actions tab       the same, for any branch
#   Pushing a tag like v0.2.0               the same, then uploads the
#                                           installers to a DRAFT release;
#                                           RIG's apps see the update only
#                                           once someone publishes it

name: Desktop app

on:
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/workflows/desktop.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Typecheck, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check

  draft-release:
    name: Draft the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: The tag matches the app's version
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version"
            exit 1
          fi
      # Made here once, so the Windows and macOS jobs add to one draft
      # instead of racing to create two.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --draft --title "AI4RIG $GITHUB_REF_NAME" --generate-notes

  package:
    name: Package (${{ matrix.name }})
    needs: [check, draft-release]
    # draft-release only runs for tags; on other runs it is skipped, not failed.
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.draft-release.result != 'failure' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            target: --win
          - name: macOS
            os: macos-latest
            target: --mac
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run desktop:dist -- ${{ matrix.target }} --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
      - name: Start the packaged app and check it works
        run: npm run desktop:smoke
      - uses: actions/upload-artifact@v7
        with:
          name: AI4RIG-${{ matrix.name }}
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.dmg
            apps/desktop/release/*.yml
          if-no-files-found: error
          retention-days: 14
